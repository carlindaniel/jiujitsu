<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Súmula de Luta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥊</text></svg>">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0d10;
  --panel:#14171c;
  --panel-2:#1b1f26;
  --line:#262b33;
  --text:#f2f3f5;
  --muted:#8a919c;
  --red:#e0392f;
  --red-dim:#3a1815;
  --blue:#2f6fe0;
  --blue-dim:#131f3a;
  --gold:#e0b02f;
  --danger:#c23a3a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef0f2;
    --panel:#ffffff;
    --panel-2:#f5f6f8;
    --line:#dde1e6;
    --text:#14171c;
    --muted:#5b6270;
    --red-dim:#fbe3e1;
    --blue-dim:#e2eafc;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d10;
  --panel:#14171c;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 14px);
  gap:10px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 4px 4px;
}
header h1{
  font-size:15px;
  font-weight:700;
  letter-spacing:.2px;
  margin:0;
  color:var(--muted);
}
.reset-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  padding:6px 10px;
  border-radius:8px;
}

/* ---- Photo ---- */
.fighter-card{
  background:var(--panel);
  border-radius:14px;
  border:1px solid var(--line);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border-top:3px solid var(--gold);
}
.photo-box{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:var(--panel-2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.photo-box::before,
.photo-box::after{
  content:"";
  position:absolute;
  top:0; bottom:0;
  width:4px;
  z-index:1;
  pointer-events:none;
}
.photo-box::before{left:0; background:var(--red);}
.photo-box::after{right:0; background:var(--blue);}
.side-tags{
  position:absolute;
  top:8px; left:8px; right:8px;
  display:flex;
  justify-content:space-between;
  z-index:1;
  pointer-events:none;
}
.side-tags span{
  font-size:11px;
  font-weight:700;
  color:#fff;
  padding:3px 8px;
  border-radius:20px;
}
.side-tags .tag-l{background:rgba(224,57,47,.85);}
.side-tags .tag-r{background:rgba(47,111,224,.85);}
.photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  padding:10px;
  text-align:center;
}
.photo-placeholder .icon{font-size:26px;}
.photo-actions{
  position:absolute;
  inset:auto 0 0 0;
  display:flex;
  gap:1px;
  background:var(--line);
}
.photo-actions button{
  flex:1;
  border:none;
  background:rgba(20,23,28,.82);
  color:#fff;
  font-size:11px;
  padding:7px 4px;
  font-weight:600;
}
.names{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--line);
}
.name-row{
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 8px;
  background:var(--panel);
}
.corner-dot{
  width:9px;height:9px;border-radius:50%;flex:none;
}
.name-row.left .corner-dot{background:var(--red);}
.name-row.right .corner-dot{background:var(--blue);}
.name-input{
  flex:1;
  min-width:0;
  background:transparent;
  border:none;
  color:var(--text);
  font-size:13px;
  font-weight:700;
  padding:2px 0;
}
.name-input:focus{outline:none;}

/* ---- Scoring ---- */
.scoring{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  flex:1;
}
.score-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 8px 12px;
  gap:8px;
}
.score-panel.left{border-top:3px solid var(--red);}
.score-panel.right{border-top:3px solid var(--blue);}
.score-value{
  font-size:44px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1;
  margin-top:2px;
}
.score-panel.left .score-value{color:var(--red);}
.score-panel.right .score-value{color:var(--blue);}
.pt-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}
.pt-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}
.pt-btn{
  border:none;
  border-radius:10px;
  padding:12px 0;
  font-size:16px;
  font-weight:700;
  color:#fff;
}
.pt-btn.plus{background:var(--panel-2);border:1px solid var(--line);}
.score-panel.left .pt-btn.plus{color:var(--red);}
.score-panel.right .pt-btn.plus{color:var(--blue);}
.pt-btn.minus{background:var(--panel-2);border:1px solid var(--line);color:var(--danger);}
.pt-btn:active{transform:scale(.94);}
.undo-btn{
  margin-top:2px;
  background:none;
  border:none;
  color:var(--muted);
  font-size:12px;
  padding:4px 8px;
}

/* ---- Timer ---- */
.timer{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)*0);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.round-label{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}
.round-label button{
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  width:24px;height:24px;
  border-radius:6px;
  font-size:14px;
  line-height:1;
}
.clock{
  font-size:56px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  color:var(--gold);
  letter-spacing:1px;
}
.clock.warn{color:var(--danger);}
.time-edit{
  display:flex;
  align-items:center;
  gap:10px;
}
.time-edit label{font-size:11px;color:var(--muted);}
.time-edit input{
  width:56px;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:6px 4px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.timer-controls{
  display:flex;
  gap:8px;
  width:100%;
}
.timer-controls button{
  flex:1;
  border:none;
  border-radius:12px;
  padding:13px 0;
  font-size:15px;
  font-weight:700;
}
.btn-start{background:var(--gold);color:#141200;}
.btn-pause{background:var(--panel-2);border:1px solid var(--line);color:var(--text);}
.btn-clear{background:var(--panel-2);border:1px solid var(--line);color:var(--danger);}

input[type=file]{display:none;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SÚMULA · CONTROLE DE LUTA</h1>
    <button class="reset-btn" id="newFightBtn">Nova luta</button>
  </header>

  <div class="fighter-card">
    <div class="photo-box" id="photoBox">
      <div class="side-tags">
        <span class="tag-l">ESQUERDA</span>
        <span class="tag-r">DIREITA</span>
      </div>
      <div class="photo-placeholder" id="ph">
        <span class="icon">📷</span>
        <span>Foto dos dois competidores, lado a lado</span>
      </div>
      <div class="photo-actions">
        <button id="takePhotoBtn">Tirar foto</button>
      </div>
    </div>
    <div class="names">
      <div class="name-row left">
        <span class="corner-dot"></span>
        <input class="name-input" id="nameL" placeholder="Nome (esquerda)" maxlength="24">
      </div>
      <div class="name-row right">
        <span class="corner-dot"></span>
        <input class="name-input" id="nameR" placeholder="Nome (direita)" maxlength="24">
      </div>
    </div>
  </div>

  <input type="file" id="filePhoto" accept="image/*" capture="environment">

  <div class="scoring">
    <div class="score-panel left">
      <div class="round-label" style="margin-bottom:-4px;">ESQUERDA</div>
      <div class="score-value" id="scoreL">0</div>
      <div class="pt-group">
        <div class="pt-row">
          <button class="pt-btn plus" data-side="L" data-val="2">+2</button>
          <button class="pt-btn plus" data-side="L" data-val="3">+3</button>
          <button class="pt-btn plus" data-side="L" data-val="4">+4</button>
        </div>
        <div class="pt-row">
          <button class="pt-btn minus" data-side="L" data-val="-2">−2</button>
          <button class="pt-btn minus" data-side="L" data-val="-3">−3</button>
          <button class="pt-btn minus" data-side="L" data-val="-4">−4</button>
        </div>
      </div>
      <button class="undo-btn" data-side="L">↺ desfazer última</button>
    </div>

    <div class="score-panel right">
      <div class="round-label" style="margin-bottom:-4px;">DIREITA</div>
      <div class="score-value" id="scoreR">0</div>
      <div class="pt-group">
        <div class="pt-row">
          <button class="pt-btn plus" data-side="R" data-val="2">+2</button>
          <button class="pt-btn plus" data-side="R" data-val="3">+3</button>
          <button class="pt-btn plus" data-side="R" data-val="4">+4</button>
        </div>
        <div class="pt-row">
          <button class="pt-btn minus" data-side="R" data-val="-2">−2</button>
          <button class="pt-btn minus" data-side="R" data-val="-3">−3</button>
          <button class="pt-btn minus" data-side="R" data-val="-4">−4</button>
        </div>
      </div>
      <button class="undo-btn" data-side="R">↺ desfazer última</button>
    </div>
  </div>

  <div class="timer">
    <div class="round-label">
      <span>Round</span>
      <button id="roundMinus">−</button>
      <span id="roundNum">1</span>
      <button id="roundPlus">+</button>
    </div>
    <div class="clock" id="clock">03:00</div>
    <div class="time-edit">
      <label>Duração (min:seg)</label>
      <input type="number" id="editMin" min="0" max="59" value="3">
      <span style="color:var(--muted);font-weight:700;">:</span>
      <input type="number" id="editSec" min="0" max="59" value="0">
    </div>
    <div class="timer-controls">
      <button class="btn-start" id="startBtn">Iniciar</button>
      <button class="btn-pause" id="pauseBtn">Pausar</button>
      <button class="btn-clear" id="resetTimerBtn">Zerar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'arbitro_luta_state_v1';

  function safeLoad(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function safeSave(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  const saved = safeLoad() || {};

  const state = {
    photo: saved.photo || saved.photoL || null,
    nameL: saved.nameL || '',
    nameR: saved.nameR || '',
    scoreL: typeof saved.scoreL === 'number' ? saved.scoreL : 0,
    scoreR: typeof saved.scoreR === 'number' ? saved.scoreR : 0,
    historyL: saved.historyL || [],
    historyR: saved.historyR || [],
    round: saved.round || 1,
    durationSec: typeof saved.durationSec === 'number' ? saved.durationSec : 180
  };

  function persist(){
    safeSave({
      photo: state.photo,
      nameL: state.nameL, nameR: state.nameR,
      scoreL: state.scoreL, scoreR: state.scoreR,
      historyL: state.historyL, historyR: state.historyR,
      round: state.round, durationSec: state.durationSec
    });
  }

  // ---- Elements ----
  const el = id => document.getElementById(id);
  const nameL = el('nameL'), nameR = el('nameR');
  const scoreLEl = el('scoreL'), scoreREl = el('scoreR');
  const clockEl = el('clock');
  const editMin = el('editMin'), editSec = el('editSec');
  const roundNum = el('roundNum');

  // ---- Names ----
  nameL.value = state.nameL;
  nameR.value = state.nameR;
  nameL.addEventListener('input', ()=>{ state.nameL = nameL.value; persist(); });
  nameR.addEventListener('input', ()=>{ state.nameR = nameR.value; persist(); });

  // ---- Photo ----
  function renderPhoto(){
    const box = el('photoBox');
    const ph = el('ph');
    let img = box.querySelector('img');
    if(state.photo){
      if(!img){
        img = document.createElement('img');
        box.insertBefore(img, box.firstChild);
      }
      img.src = state.photo;
      ph.style.display = 'none';
    } else {
      if(img) img.remove();
      ph.style.display = 'flex';
    }
  }
  renderPhoto();

  el('takePhotoBtn').addEventListener('click', ()=>{
    el('filePhoto').click();
  });

  el('filePhoto').addEventListener('change', (e)=>{
    const input = e.target;
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      state.photo = reader.result;
      renderPhoto();
      persist();
      input.value = '';
    };
    reader.onerror = () => { input.value = ''; };
    reader.readAsDataURL(file);
  });

  // ---- Scoring ----
  function renderScores(){
    scoreLEl.textContent = state.scoreL;
    scoreREl.textContent = state.scoreR;
  }
  renderScores();

  document.querySelectorAll('.pt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const side = btn.dataset.side;
      const val = parseInt(btn.dataset.val, 10);
      if(side === 'L'){ state.scoreL += val; state.historyL.push(val); }
      else { state.scoreR += val; state.historyR.push(val); }
      renderScores();
      persist();
    });
  });

  document.querySelectorAll('.undo-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const side = btn.dataset.side;
      if(side === 'L' && state.historyL.length){
        state.scoreL -= state.historyL.pop();
      } else if(side === 'R' && state.historyR.length){
        state.scoreR -= state.historyR.pop();
      }
      renderScores();
      persist();
    });
  });

  el('newFightBtn').addEventListener('click', ()=>{
    if(!confirm('Iniciar nova luta? Foto, nomes e pontos serão apagados.')) return;
    state.photo = null;
    state.nameL = ''; state.nameR = '';
    state.scoreL = 0; state.scoreR = 0;
    state.historyL = []; state.historyR = [];
    state.round = 1;
    nameL.value = ''; nameR.value = '';
    renderPhoto();
    renderScores();
    roundNum.textContent = state.round;
    persist();
  });

  // ---- Round counter ----
  roundNum.textContent = state.round;
  el('roundPlus').addEventListener('click', ()=>{
    state.round += 1; roundNum.textContent = state.round; persist();
  });
  el('roundMinus').addEventListener('click', ()=>{
    state.round = Math.max(1, state.round - 1); roundNum.textContent = state.round; persist();
  });

  // ---- Timer ----
  let remaining = state.durationSec;
  let running = false;
  let intervalId = null;
  let endAt = null;

  editMin.value = Math.floor(state.durationSec / 60);
  editSec.value = state.durationSec % 60;

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function renderClock(){
    clockEl.textContent = fmt(remaining);
    clockEl.classList.toggle('warn', remaining <= 10 && remaining > 0);
    if(remaining <= 0){
      clockEl.textContent = '00:00';
    }
  }
  renderClock();

  function tick(){
    const now = Date.now();
    remaining = Math.max(0, (endAt - now) / 1000);
    renderClock();
    if(remaining <= 0){
      stopTimer();
      if(navigator.vibrate) { try{ navigator.vibrate([200,100,200]); }catch(e){} }
    }
  }

  function startTimer(){
    if(running) return;
    if(remaining <= 0) remaining = state.durationSec;
    endAt = Date.now() + remaining * 1000;
    running = true;
    intervalId = setInterval(tick, 200);
  }
  function pauseTimer(){
    if(!running) return;
    running = false;
    clearInterval(intervalId);
  }
  function stopTimer(){
    running = false;
    clearInterval(intervalId);
    remaining = 0;
    renderClock();
  }
  function resetTimer(){
    pauseTimer();
    remaining = state.durationSec;
    renderClock();
  }

  el('startBtn').addEventListener('click', startTimer);
  el('pauseBtn').addEventListener('click', pauseTimer);
  el('resetTimerBtn').addEventListener('click', resetTimer);

  function updateDuration(){
    let m = parseInt(editMin.value, 10); if(isNaN(m) || m < 0) m = 0;
    let s = parseInt(editSec.value, 10); if(isNaN(s) || s < 0) s = 0;
    if(s > 59) s = 59;
    state.durationSec = m * 60 + s;
    if(!running){
      remaining = state.durationSec;
      renderClock();
    }
    persist();
  }
  editMin.addEventListener('change', updateDuration);
  editSec.addEventListener('change', updateDuration);

})();
</script>
</body>
</html>
